<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style> body { background-image: linear-gradient( rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45) ), url("{{ url_for('static', filename='images/exam-bg.jpg') }}"); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; } </style>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <i class="fas fa-user-circle auth-icon"></i>

        <h2>Login</h2>

        {% with messages =
        get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}
        {% endwith %}

        <form action="{{ url_for('login_page') }}"
              method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Sign In
            </button>

        </form>

        <p class="link-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register Here
            </a>

        </p>

        <a href="/" class="back-home">
            ← Back To Home
        </a>

    </div>

</div>

</body>

</html>
