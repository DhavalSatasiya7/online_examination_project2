<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Examination System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="register-box">

        <div class="icon">
            <i class="fas fa-user-plus"></i>
        </div>

        <h2>Create Account</h2>

        <p>Register for Online Examination System</p>

        <form action="/register"
      method="POST"
      enctype="multipart/form-data">

    <div class="input-group">
        <input type="text"
               name="fullname"
               placeholder="Full Name"
               required>
    </div>

    <div class="input-group">
        <input type="text"
               name="username"
               placeholder="Username"
               required>
    </div>

    <div class="input-group">
        <input type="email"
               name="email"
               placeholder="Email Address"
               required>
    </div>

    <!-- Mobile Number -->
    <div class="input-group">
        <input type="text"
               name="mobile"
               placeholder="Mobile Number"
               maxlength="10"
               pattern="[0-9]{10}"
               required>
    </div>
            <div class="input-group">
        <input type="password"
               name="password"
               placeholder="Password"
               required>
    </div>

    <!-- Profile Photo -->
    <div class="input-group">
        <label style="display:block; margin-bottom:5px;">
            Upload Profile Photo
        </label>

        <input type="file"
               name="photo"
               accept="image/*"
               required>
    </div>



    <button type="submit">
        Register
    </button>

</form>

        <div class="links">
            Already have an account?
            <a href="/login">Login Here</a>
        </div>

        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</div>
<script src="{{ url_for('static',
filename='js/darkmode.js') }}"></script>
</body>
</html>
