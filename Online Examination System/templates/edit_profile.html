<!DOCTYPE html>
<html>
<head>

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-primary text-white">

<h3>Edit Profile</h3>

</div>

<div class="card-body">

<form method="POST"
      enctype="multipart/form-data">

<div class="mb-3">

<label>Full Name</label>

<input type="text"
       class="form-control"
       name="fullname"
       value="{{ student.fullname }}">

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
       class="form-control"
       name="email"
       value="{{ student.email }}">

</div>

<div class="mb-3">

<label>Mobile</label>

<input type="text"
       class="form-control"
       name="mobile"
       value="{{ student.mobile }}">

</div>

<div class="mb-3">

<label>Profile Photo</label>

{% if student.photo %}
<img src="{{ url_for('static', filename='uploads/' ~ student.photo) }}"
     width="90"
     height="90"
     style="border-radius:50%;object-fit:cover;display:block;margin-bottom:10px;"
     onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/default-user.svg') }}';">
{% endif %}

<input type="file"
       class="form-control"
       name="photo"
       accept="image/*">

</div>

<button class="btn btn-success">

Update Profile

</button>

</form>

</div>

</div>

</div>
<script src="{{ url_for('static',
filename='js/darkmode.js') }}"></script>
</body>
</html>
