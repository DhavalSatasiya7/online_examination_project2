<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body><!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark">

                    <h3>Edit Exam</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Exam Name

                            </label>

                            <input type="text"
                                   name="exam_name"
                                   class="form-control"
                                   value="{{ exam.exam_name }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Duration (Minutes)

                            </label>

                            <input type="number"
                                   name="duration"
                                   class="form-control"
                                   value="{{ exam.duration }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Total Marks

                            </label>

                            <input type="number"
                                   name="total_marks"
                                   class="form-control"
                                   value="{{ exam.total_marks }}"
                                   required>

                        </div>




                        <button class="btn btn-success">

                            Update Exam

                        </button>

                        <a href="{{ url_for('view_exam') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

</body>
</html>
