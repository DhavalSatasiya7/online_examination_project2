<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Questions</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f5f5f5;
        }

        .navbar{
            margin-bottom:30px;
        }

        .card{
            border:none;
            border-radius:12px;
        }

        .table td,
        .table th{
            vertical-align:middle;
        }

    </style>

</head>

<body>

<!-- =========================
        NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('home') }}">

            <i class="fa-solid fa-graduation-cap"></i>

            Online Examination System

        </a>

        <div>

            <a href="{{ url_for('admin_dashboard') }}"
               class="btn btn-outline-light me-2">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

            <a href="{{ url_for('logout') }}"
               class="btn btn-danger">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Add New Question</h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <!-- Subject Dropdown -->
                        <div class="mb-3">
                            <label class="form-label">
                                Select Subject
                            </label>

                            <select
                                class="form-select"
                                name="subject_id"
                                required>

                                <option value="">
                                    -- Select Subject --
                                </option>

                                {% for subject in subjects %}
                                <option value="{{ subject.id }}">
                                    {{ subject.subject_name }}
                                </option>
                                {% endfor %}

                            </select>
                        </div>

                        <!-- Question -->
                        <div class="mb-3">
                            <label class="form-label">
                                Question
                            </label>

                            <textarea
                                class="form-control"
                                name="question_text"
                                rows="3"
                                placeholder="Enter Question"
                                required></textarea>
                        </div>

                        <!-- Option 1 -->
                        <div class="mb-3">
                            <label class="form-label">
                                Option 1
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="option1"
                                placeholder="Enter Option 1"
                                required>
                        </div>

                        <!-- Option 2 -->
                        <div class="mb-3">
                            <label class="form-label">
                                Option 2
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="option2"
                                placeholder="Enter Option 2"
                                required>
                        </div>

                        <!-- Option 3 -->
                        <div class="mb-3">
                            <label class="form-label">
                                Option 3
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="option3"
                                placeholder="Enter Option 3"
                                required>
                        </div>

                        <!-- Option 4 -->
                        <div class="mb-3">
                            <label class="form-label">
                                Option 4
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="option4"
                                placeholder="Enter Option 4"
                                required>
                        </div>

                        <!-- Correct Option -->
                        <div class="mb-3">
                            <label class="form-label">
                                Correct Answer
                            </label>

                            <select
                                class="form-select"
                                name="correct_option"
                                required>

                                <option value="">
                                    Select Correct Answer
                                </option>

                                <option value="1">
                                    Option 1
                                </option>

                                <option value="2">
                                    Option 2
                                </option>

                                <option value="3">
                                    Option 3
                                </option>

                                <option value="4">
                                    Option 4
                                </option>

                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Add Question

                            </button>

                            <a
                                href="{{ url_for('admin_dashboard') }}"
                                class="btn btn-secondary">

                                Back to Dashboard

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
